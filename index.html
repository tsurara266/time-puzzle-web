<h1>Time Puzzle</h1>
<p>Time Puzzle は、タスクを時間ブロックに変換してスケジュールを立てるための個人用アプリです。</p>
<p>タスクを「作業空間」に置き、ドラッグ＆ドロップでタイムラインに配置することで、1日の予定を直感的に組み立てられます。</p>
<h2>主な機能</h2>
<ul>
<li>タスクの階層管理（プロジェクト → 親タスク → サブタスク）</li>
<li>ドラッグ＆ドロップによるスケジュール配置</li>
<li>Google カレンダー連携（読み込み・書き込み）</li>
<li>繰り返しタスクの自動生成</li>
<li>マインドマップによるタスク整理</li>
</ul>
